<g>
<circle cx="150" cy="210" r="104" fill="#ffb238" stroke="#0d0b1a" stroke-width="6"/>
<g class="ring"><circle cx="150" cy="210" r="88" fill="none" stroke="#0d0b1a" stroke-width="3" stroke-dasharray="4 10"/></g>
<g class="lid"><path d="M86 210q64-58 128 0q-64 58-128 0z" fill="#f3e9d7" stroke="#0d0b1a" stroke-width="6"/>
<g class="pupil"><circle cx="150" cy="210" r="22" fill="#0d0b1a"/><circle cx="150" cy="210" r="10" fill="#ff4d5e"/><circle cx="143" cy="203" r="4" fill="#fff"/></g></g>
