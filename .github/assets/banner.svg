<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a2a"/><stop offset=".55" stop-color="#5a1a5e"/><stop offset="1" stop-color="#ff4d5e"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff4d8a"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b0f3d"/><stop offset="1" stop-color="#0d0b1a"/></linearGradient>
<clipPath id="sc"><circle cx="840" cy="250" r="120"/></clipPath>
<style>
.title{font:900 118px Impact,'Arial Black',sans-serif;letter-spacing:4px}
.sub{font:700 22px 'Courier New',monospace;letter-spacing:6px;fill:#f3e9d7}
.glitch{animation:gl 3.2s infinite steps(1)}
@keyframes gl{0%,92%{transform:translate(0,0)}93%{transform:translate(-6px,2px)}95%{transform:translate(5px,-2px)}97%{transform:translate(0,0)}}
.ring{transform-origin:150px 210px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pupil{animation:look 5s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(9px)}60%{transform:translateX(-9px)}}
.lid{transform-origin:150px 210px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateY(-420px)}to{transform:translateY(420px)}}
.sunb{animation:rise 7s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(-8px)}}
.wave{animation:wv 4s ease-in-out infinite alternate}
@keyframes wv{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
</style>
</defs>
