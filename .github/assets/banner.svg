<path d="M1050 330c4-60 8-110 2-150M1052 182c-30-6-58 4-76 22M1052 182c24-18 54-20 78-6M1052 182c-12-24-34-38-60-40M1052 182c18-22 40-30 64-26M1052 182c-4 22 4 42 18 54" stroke="#0d0b1a" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M480 330c-2-50-8-90-22-120M458 212c-26 2-48 16-58 36M458 212c20-14 46-16 68-4M458 212c-16-18-40-24-62-20M458 212c16-20 38-26 58-20" stroke="#0d0b1a" stroke-width="6" fill="none" stroke-linecap="round"/>
</g>
<rect y="330" width="1200" height="90" fill="url(#sea)"/>
