<g clip-path="url(#sc)" fill="#5a1a5e" opacity=".55"><rect x="700" y="262" width="300" height="8"/><rect x="700" y="284" width="300" height="11"/><rect x="700" y="310" width="300" height="14"/><rect x="700" y="340" width="300" height="18"/></g></g>
